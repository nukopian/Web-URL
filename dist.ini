name    = Web-URL
author  = Iain Campbell <cpanic@cpan.org>
license = MIT
copyright_holder = Iain Campbell

[@Basic]

[SetEnv]

[PkgVersion]
[Git::NextVersion]
version_regexp = ^v(.+)$

[Prereqs]
perl = 5.038
Ref::Util = 0
Scalar::Util = 0
URI = 0
URI::Encode = 0
namespace::clean = 0

[MetaResources]
repository.url  = https://github.com/nukopian/Web-URL.git
repository.web  = https://github.com/nukopian/Web-URL
repository.type = git
bugtracker.web  = https://github.com/nukopian/Web-URL/issues

[Git::Commit]
[Git::Tag]
[Git::Push]

[ManifestSkip]

[PodWeaver]
[ReadmeAnyFromPod]
type = markdown
filename = README.md
location = root

[AutoPrereqs]

[ConfirmRelease]
[UploadToCPAN]
